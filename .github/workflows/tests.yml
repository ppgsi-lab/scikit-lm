name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  check:
    name: check / py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The non-slow suite runs entirely on the torch-free FakeBackend; rich+tqdm
      # are all the dashboard tests need (the rest import-skip). Keeping torch out
      # means the matrix isn't gated on a torch wheel existing for each version yet.
      - name: Install dependencies
        run: uv sync --extra rich --extra tqdm
      - name: Lint
        run: uv run ruff check
      - name: Format
        run: uv run ruff format --check
      - name: Unit tests
        run: uv run pytest -m "not slow"

  typecheck:
    # pyright statically resolves the mlx and plotext imports, so it only passes
    # where both install: an Apple-Silicon runner with every extra present.
    name: typecheck (macOS arm64)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --extra all
      - name: Type check
        run: uv run pyright
